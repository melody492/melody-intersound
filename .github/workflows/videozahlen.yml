name: Videozahlen täglich

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aufrufzahlen von YouTube holen
        run: python3 .github/scripts/videozahlen.py
      - name: Hochladen, falls geändert
        run: |
          git config user.name "Videozahlen (automatisch)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/videos.js
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Videozahlen aktualisiert ($(TZ=Europe/Vienna date +%d.%m.%Y), Cloud)"
          git push
